spring:
  datasource:
    url: jdbc:mysql://localhost:3308/gantodo_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: gantodo
    password: gantodo1234
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

jwt:
  secret: test-secret-key-minimum-32-bytes-long-padding
  access-expiration: 3600
  refresh-expiration: 1209600

app:
  frontend-url: http://localhost:5173
  cookie-secure: false
