spring:
  main:
    web-application-type: servlet
  application:
    name: todo-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/gantodo_db}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:gantodo}
    password: ${DB_PASSWORD:gantodo1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration