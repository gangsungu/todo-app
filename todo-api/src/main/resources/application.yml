spring:
  main:
    web-application-type: servlet
  application:
    name: todo-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/gantodo_db}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:gantodo}
    password: ${DB_PASSWORD:gantodo1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600
  refresh-expiration: 1209600

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}